ith bubbles. Tonight went right for once.","bar.md.heartbroken":"Something sour. Match my heart.","bar.md.homesick":"Something sweet and warm, like home used to taste.","bar.md.low":"Cold and bitter, like my week.","bar.md.restless":"Something cold and fresh. I cannot sit still.","bar.md.tired":"Something warm and soft, like a blanket I forgot I owned.","bar.md.wrong":"That does not fit how they feel. Any drink with the right taste will do.","bar.nt.at.late":"{at}: the late crowd comes in. That is rush hour, and last call comes before it ends.","bar.nt.at.work":"{at}: the after-work crowd comes in and the stools fill fast.","bar.nt.bloom":"First Bloom: the first night of spring, and the vents smell of green things.","bar.nt.bloom.say":"Something fresh, like the first warm night.","bar.nt.board":"Tonight at Cyberia","bar.nt.board.at":"Tonight at {where}","bar.nt.by":"Hosted by {who}.","bar.nt.derby":"Derby Night: beetle tips change hands under the counter.","bar.nt.derby.say":"Something strong. My beetle runs in the next heat.","bar.nt.eclipse":"Eclipse: the moon over the island goes dark and the neon looks brighter.","bar.nt.eclipse.say":"Something dark and bitter, to match the sky.","bar.nt.fans":"Fan Failure: the server fans gave out and the whole club runs hot.","bar.nt.fans.say":"Something cold, before I melt into the stool.","bar.nt.fools":"Fools Night: nothing at the bar is quite what it says.","bar.nt.fools.0":"Fools Night: the menu board swapped every name around, and nobody has noticed yet.","bar.nt.fools.1":"Fools Night: the jukebox only plays the same song, and swears it is a different one each time.","bar.nt.fools.2":"Fools Night: the stools all moved one seat to the left while nobody was looking.","bar.nt.fools.say":"Something sour. And no tricks, please.","bar.nt.ghost":"Ghost in the Reels: after midnight the machines play on their own and the screens flicker green.","bar.nt.ghost.say":"Something cold. That machine just winked at me.","bar.nt.halloween":"Halloween at Cyberia: masks at the door, lanterns on the bar, and something moving in the static.","bar.nt.halloween.say":"Something dark and sweet. Trick or treat.","bar.nt.harvest":"Harvest Night: the market brings its last crates, and the bar smells of apples.","bar.nt.harvest.say":"Something warm and sweet, like the last of the harvest.","bar.nt.hearts":"Hearts Night: paper hearts on every stool, and notes passed along the bar.","bar.nt.hearts.say":"Something sweet, to say what I cannot.","bar.nt.highroll":"High Roller Night: the velvet booths fill with cats in their best coats.","bar.nt.highroll.say":"Something strong, and make it look expensive.","bar.nt.jackpot":"Jackpot Night: the reels light up the whole lounge and nobody wants to go home.","bar.nt.jackpot.say":"Something sweet with bubbles, for luck.","bar.nt.last":"Last call!","bar.nt.midsummer":"Midsummer: the shortest night of the year, and nobody wants it to end.","bar.nt.midsummer.say":"Something cold and fresh, it is still warm out.","bar.nt.midwinter":"Midwinter: the longest night of the year, and the club keeps every lamp lit.","bar.nt.midwinter.say":"Something warm and creamy, the night is long.","bar.nt.moths":"Moth Night: they gather at the neon and the patrons gather with them.","bar.nt.moths.say":"Something sweet, while the moths are out.","bar.nt.neon":"Neon Wheel: the wheel spins in pink light and the walls spin along with it.","bar.nt.neon.say":"Something sharp, so I can keep my eyes on the wheel.","bar.nt.newyear":"New Year at Cyberia: the whole club counts down together, and the screens all show the same clock.","bar.nt.newyear.say":"Something with bubbles, before the clock runs out.","bar.nt.next":"Tomorrow","bar.nt.none":"The club board is dark tonight.","bar.nt.off":"The power is out. Tonight it is the house card and stirred drinks only.","bar.nt.openmic":"Open Mic: anyone can take the stage, and anyone does.","bar.nt.openmic.say":"Something sweet and fizzy to cheer them on.","bar.nt.packets":"Packet Storm: messages arrive hours late and in the wrong order.","bar.nt.packets.say":"Something sour. My messages came in the wrong order again.","bar.nt.pk.late":"The late crowd is in and the stools fill fast.","bar.nt.pk.work":"The after-work crowd is in and the stools fill fast.","bar.nt.powercut":"Power Cut: the shakers stay on the shelf and the candles come out.","bar.nt.powercut.say":"Lovely by candlelight. Whatever you can pour without the power.","bar.nt.quiet":"Quiet Night: a few regulars, low lights and the hum of the servers.","bar.nt.quiet.say":"Nice and quiet tonight. Take your time.","bar.nt.race":"Race Night: the big screen shows the laps and the bar cheers every one.","bar.nt.race.say":"Something with bubbles before the next lap!","bar.nt.rain":"Rain on the Wire: it drums on the roof and everyone stays a while longer.","bar.nt.rain.say":"Something warm, it is pouring out there.","bar.nt.reboot":"Reboot Night: the Wired came back up this morning and everyone feels new.","bar.nt.reboot.say":"Something fresh, for a fresh start.","bar.nt.rush":"Rush hour: the sweet spot will not keep still.","bar.nt.starfall":"Starfall: the sky over the Wired rains falling stars, and the roof is full.","bar.nt.starfall.say":"Something cold and sweet, for watching the sky.","bar.nt.static":"Static Night","bar.nt.static.0":"Static Night: the screens show snow and the speakers hiss along.","bar.nt.static.1":"Static Night: every screen in the club shows the same face, and nobody knows whose.","bar.nt.static.2":"Static Night: the jukebox plays tomorrow's songs backwards.","bar.nt.static.say":"The screens are all snow tonight.","bar.nt.tab":"Tonight","bar.rg.clover.0":"Lucky Clover, they call me at the lounge. I have not been lucky in a long time.","bar.rg.clover.0.j":"I would bet you cannot guess my name. Kidding. I am trying not to bet.","bar.rg.clover.0.l":"It is not the stars. It is the moment before the dice land.","bar.rg.clover.0.r":"Moth Mojito. Cold. It keeps my paws off the dice.","bar.rg.clover.1":"I lost my good coat at the tables tonight and walked here in the cold.","bar.rg.clover.1.j":"The coat looked better on the dealer anyway.","bar.rg.clover.1.l":"I keep saying one more round. There is always one more round.","bar.rg.clover.1.r":"A Dew Drop. I deserve the cold one.","bar.rg.clover.2":"My brother came to the lounge to find me. I pretended not to see him.","bar.rg.clover.2.j":"I hid behind a slot machine. They are not very wide.","bar.rg.clover.2.l":"He just wanted me home for dinner. That is all he ever wants.","bar.rg.clover.2.r":"Beetle Juice. Sour, like my face when he walked in.","bar.rg.clover.3":"I went to his dinner, and I did not go to the lounge after. The first night in ages.","bar.rg.clover.3.j":"I played cards with his kids for crumbs. I lost. Badly.","bar.rg.clover.3.l":"My paws shook the whole time. I did not know what to do with them.","bar.rg.clover.3.r":"Night Nectar. Like his cooking, too sweet and perfect.","bar.rg.clover.4":"A whole week without the tables. I sleep at night now. It is strange.","bar.rg.clover.4.j":"Turns out nights are long when you are not losing.","bar.rg.clover.4.l":"The quiet is loud. I am learning it.","bar.rg.clover.4.r":"Hive Mead. Slow and warm, in no hurry.","bar.rg.clover.5":"I got my coat back. Worked it off sweeping the lounge floor, and never touched a single die.","bar.rg.clover.5.j":"I know every crumb under those tables now. Personally.","bar.rg.clover.5.l":"The dealer shook my paw and said she was glad to lose a customer.","bar.rg.clover.5.r":"Firefly Fizz. Bubbles, not dice. I can live with that.","bar.rg.clover.6":"I am going home to my brother's for the spring. I pressed a clover the night I stopped. It is for you. You were the stop before the lounge.","bar.rg.clover.6.j":"I bet you will miss me. That is my last bet. I promise.","bar.rg.clover.6.l":"If I ever go back to the lounge, it will be to sweep.","bar.rg.clover.6.r":"Beetle Juice. The first thing I ever ordered here.","bar.rg.clover.done":"Clover tucks a pressed clover between two napkins and slides it over to you.","bar.rg.clover.hi.j":"Your joke cost me nothing. The best deal in the Wired.","bar.rg.clover.hi.l":"I thought about what you said instead of the dice.","bar.rg.comes":"Comes in now and then. Serve them well.","bar.rg.dusk.0":"Twelve hours down with the relay racks. If one hums wrong, half the Wired goes quiet, and nobody up here knows my name.","bar.rg.dusk.0.j":"Yes, I tried turning it off and on again. Twice tonight.","bar.rg.dusk.0.l":"You want to hear about racks? Huh. Nobody asks.","bar.rg.dusk.0.r":"Night Nectar. You read me like a status light.","bar.rg.dusk.1":"Rack nine dropped packets all night. I found the fault by smell. Burnt dust smells like nothing else.","bar.rg.dusk.1.j":"Do not laugh, but I named the fan. It is called Gerald now.","bar.rg.dusk.1.l":"It was a loose fan. A tiny thing, and it kept a whole district dark.","bar.rg.dusk.1.r":"A Dew Drop, cold as the server floor. Good.","bar.rg.dusk.2":"They want to swap my racks for new ones. Shiny, quiet, and no keeper needed.","bar.rg.dusk.2.j":"Maybe the new ones will need someone to talk to them. I could do that.","bar.rg.dusk.2.l":"I know the new ones are better. That is the part that stings.","bar.rg.dusk.2.r":"Mint and ice. That clears the head.","bar.rg.dusk.3":"Sent my last report today. Two lines came back: thanks, noted. Eleven years, two lines.","bar.rg.dusk.3.j":"Two lines. I have written longer notes to Gerald.","bar.rg.dusk.3.l":"Thank you for not saying it is fine. It is not fine yet.","bar.rg.dusk.3.r":"Sour and sweet at once. That is exactly it.","bar.rg.dusk.4":"I stayed after the handover to show the new crew where the floor creaks. They did not need me. They let me stay anyway.","bar.rg.dusk.4.j":"One of them asked if I was a ghost of the old system. I said only on weekends.","bar.rg.dusk.4.l":"They asked me to come back and visit. I think they meant it.","bar.rg.dusk.4.r":"Hive Mead. Warm all the way down.","bar.rg.dusk.5":"I came up the stairs before midnight tonight. First time ever. The music is louder from inside the room.","bar.rg.dusk.5.j":"I danced. Badly. Please never tell rack nine.","bar.rg.dusk.5.l":"I always heard it through the ceiling. It is different when it is around you.","bar.rg.dusk.5.r":"Firefly Fizz. It even looks like a party.","bar.rg.dusk.6":"Last night down there. I took the old key off its hook before they switch the racks off. You kept a light on up here for me, so it should be yours.","bar.rg.dusk.6.j":"If anything up here hums wrong, you know where to find me.","bar.rg.dusk.6.l":"I will still come by. Just from the front door now.","bar.rg.dusk.6.r":"Night Nectar again. Like the first night. You remembered.","bar.rg.dusk.done":"Dusk sets an old rack key on the bar and slides it over to you.","bar.rg.dusk.hi.j":"I told the racks your joke from last time. They did not laugh. I did.","bar.rg.dusk.hi.l":"Still thinking about how you listened last time.","bar.rg.fern.0":"I grow things on the roof of a server block. Real seeds, in the Wired. Most of them do not know what to do here.","bar.rg.fern.0.j":"My tomatoes have better uptime than the network.","bar.rg.fern.0.l":"The heat from the racks keeps them warm. The light is the hard part.","bar.rg.fern.0.r":"Night Nectar. It tastes like the garden I left.","bar.rg.fern.1":"Frost came down the vents last night. Half the seedlings are gone.","bar.rg.fern.1.j":"I am filing a complaint with the weather. It never answers.","bar.rg.fern.1.l":"You plant knowing some will not make it. That never helps.","bar.rg.fern.1.r":"A Dew Drop. Cold like the frost, but kinder.","bar.rg.fern.2":"I planted again. Every morning I check the soil, and every morning there is nothing.","bar.rg.fern.2.j":"I have started reading to them. Mostly error logs. They hate it.","bar.rg.fern.2.l":"Waiting is the whole job. Nobody tells you that.","bar.rg.fern.2.r":"Moth Mojito. Mint from somewhere it grows easy.","bar.rg.fern.3":"I carried soil up nine flights of stairs today. The lift is for servers only.","bar.rg.fern.3.j":"The servers got the lift and I got the stairs. Fair, really.","bar.rg.fern.3.l":"My back hurts, but it is a good hurt. It means I did something.","bar.rg.fern.3.r":"Hive Mead. The bees would be proud of me.","bar.rg.fern.4":"Green! One shoot, tiny, crooked and green, on the first day of spring.","bar.rg.fern.4.j":"I have named it. It ignores me, like all the best plants.","bar.rg.fern.4.l":"I sat with it for an hour, just watching. The best hour all winter.","bar.rg.fern.4.r":"Firefly Fizz. Bright like the shoot.","bar.rg.fern.5":"The building wants the roof back for cooling fans. They gave me until the end of the month.","bar.rg.fern.5.j":"I offered to let the fans grow tomatoes. Nobody laughed.","bar.rg.fern.5.l":"It is their roof, I know. It still feels like they are taking the spring.","bar.rg.fern.5.r":"Beetle Juice. Sour and sweet, like the news.","bar.rg.fern.6":"I found a new spot, a window box down by the harbour. Take this seed tin. The last seeds in it are for you.","bar.rg.fern.6.j":"Water it when I am away. Talk to it. Not error logs.","bar.rg.fern.6.l":"A garden can live anywhere someone looks after it.","bar.rg.fern.6.r":"Night Nectar again. You remember everything.","bar.rg.fern.done":"Fern hands you a dented seed tin that still rattles a little.","bar.rg.fern.hi.j":"Your joke made the seedlings perk up. Or it was the water.","bar.rg.fern.hi.l":"I thought about your words while I watered.","bar.rg.fig.0":"A whole day on the line at the noodle bar. My paws will smell of garlic forever now.","bar.rg.fig.0.j":"If I sweat any more garlic I can season the soup by standing near it.","bar.rg.fig.0.l":"I love cooking. I just love it more when it is mine.","bar.rg.fig.0.r":"Hive Mead. Sweet, after a day of salt.","bar.rg.fig.1":"I want a cart. A little food cart by the harbour, with my own recipes and my own hours.","bar.rg.fig.1.j":"I have a name for it already. That is half the work, right?","bar.rg.fig.1.l":"I have the dishes planned. Just not the cart.","bar.rg.fig.1.r":"Moth Mojito. Fresh, like a new menu.","bar.rg.fig.2":"I priced a cart today. Then I priced it again in case I read it wrong.","bar.rg.fig.2.j":"Maybe a very small cart. A skateboard with a pot on it.","bar.rg.fig.2.l":"Dreams are cheap. Wheels are not.","bar.rg.fig.2.r":"A Dew Drop. I needed something to wake me up.","bar.rg.fig.3":"The chef found my recipe card on the counter and laughed at it in front of everyone.","bar.rg.fig.3.j":"He laughed with garlic breath. I took it as a compliment.","bar.rg.fig.3.l":"It was my grandmother's soup, with one thing of mine added.","bar.rg.fig.3.r":"Beetle Juice. Sour, then you swallow and it is fine.","bar.rg.fig.4":"I cooked my grandmother's soup at home tonight, just for me. I cried into it a bit. It needed salt anyway.","bar.rg.fig.4.j":"Tears are basically seasoning. I am a professional.","bar.rg.fig.4.l":"She never wrote anything down. I am the only recipe card she has.","bar.rg.fig.4.r":"Night Nectar. Like her kitchen on a cold night.","bar.rg.fig.5":"The cats on my street chipped in. An old cart with rusty wheels, and it is mine.","bar.rg.fig.5.j":"One wheel squeaks. I am calling it the bell.","bar.rg.fig.5.l":"I scrubbed it all night. It shines now. Mostly.","bar.rg.fig.5.r":"Bramble Cider. Bubbles for a rusty cart.","bar.rg.fig.6":"I opened the cart at midsummer and sold out by midnight. Here is my first recipe card, the one they laughed at. It made every bowl tonight.","bar.rg.fig.6.j":"The chef came by and bought a bowl. He did not laugh once.","bar.rg.fig.6.l":"Come by the harbour some night. I will save you the corner seat.","bar.rg.fig.6.r":"Firefly Fizz. I think I am allowed one tonight.","bar.rg.fig.done":"Fig slides a stained recipe card across the bar, folded once.","bar.rg.fig.hi.j":"I told your joke on the line. The soup laughed. Bubbled, anyway.","bar.rg.fig.hi.l":"Your words were in my head the whole shift.","bar.rg.joke":"Joke","bar.rg.juniper.0":"I map the stars over the Wired. Most of them are pixels. A few are not, and I am trying to find out which.","bar.rg.juniper.0.j":"So far I have found three real stars and one very confused firefly.","bar.rg.juniper.0.l":"The fake ones twinkle on a timer. The real ones do not care.","bar.rg.juniper.0.r":"A Dew Drop. Cold, like a clear sky.","bar.rg.juniper.1":"I was up on the arcade roof all night with my chart. A cloud of static rolled in and I saw nothing.","bar.rg.juniper.1.j":"I yelled at the static. It hissed back. We are even.","bar.rg.juniper.1.l":"Half of stargazing is waiting for the sky to stop being rude.","bar.rg.juniper.1.r":"Moth Mojito. Fresh air in a glass.","bar.rg.juniper.2":"I fell asleep on the roof and woke up with my chart blown halfway to the harbour.","bar.rg.juniper.2.j":"My star chart now has a very detailed fish in it.","bar.rg.juniper.2.l":"A dock cat brought it back. It still smells of fish.","bar.rg.juniper.2.r":"Night Nectar. Warm, after a cold roof.","bar.rg.juniper.3":"The observatory says my chart is not science. Too many guesses. Too much fish.","bar.rg.juniper.3.j":"I told them the fish was on purpose. They did not believe me.","bar.rg.juniper.3.l":"Maybe it is not science. It is still true.","bar.rg.juniper.3.r":"Beetle Juice. Sour, the way they looked at me.","bar.rg.juniper.4":"My father used to point at the stars from our porch. He made up names for all of them.","bar.rg.juniper.4.j":"One of his stars was called Big Spoon Not The Little One. A very precise man.","bar.rg.juniper.4.l":"He would have loved the Wired. All the lights.","bar.rg.juniper.4.r":"Hive Mead. He drank this on the porch.","bar.rg.juniper.5":"The star shower comes this month. If any star up there is real, it will fall where my chart says.","bar.rg.juniper.5.j":"If nothing falls I will throw a pebble and call it science.","bar.rg.juniper.5.l":"I have checked the chart a hundred times. Two hundred.","bar.rg.juniper.5.r":"Bramble Cider. Bubbles, like a sky about to burst.","bar.rg.juniper.6":"They fell, right where I said, and the whole roof saw it. Take my chart, real stars and pixel ones, and the fish. You always kept the sky clear in here.","bar.rg.juniper.6.j":"The fish is official now. I named it after you.","bar.rg.juniper.6.l":"The observatory wants a copy now. I made them ask twice.","bar.rg.juniper.6.r":"Firefly Fizz. A little falling star in a glass.","bar.rg.juniper.done":"Juniper rolls up a star chart that smells faintly of fish and hands it across the bar.","bar.rg.juniper.hi.j":"Your joke is my new favourite constellation.","bar.rg.juniper.hi.l":"I thought about what you said, between the stars.","bar.rg.keep":" is in your bag now.","bar.rg.listen":"Listen","bar.rg.nib.0":"I write letters for cats who cannot find the words. Paper ones, in the Wired. You would be surprised how many come to me.","bar.rg.nib.0.j":"My handwriting is so neat the printers get jealous.","bar.rg.nib.0.l":"Most of them want the same thing said. Just in their own way.","bar.rg.nib.0.r":"Night Nectar. Sweet, for a sweet job.","bar.rg.nib.1":"A letter I wrote for a shy one worked. They are getting married on the roof of the arcade.","bar.rg.nib.1.j":"I asked for a slice of the cake. A writer's fee.","bar.rg.nib.1.l":"They invited me. I will sit at the back and cry quietly.","bar.rg.nib.1.r":"Firefly Fizz! The exact colour of a good yes.","bar.rg.nib.2":"Someone asked me to write to the cat I have been writing to in secret for years. Only I never sent mine.","bar.rg.nib.2.j":"I thought about a very small spelling mistake. I am not proud.","bar.rg.nib.2.l":"I wrote theirs. It was a good letter. I hated every word.","bar.rg.nib.2.r":"Bramble Cider. Sharp, sweet, and a bit too honest.","bar.rg.nib.3":"The letter went out. I have not heard a thing. My desk is covered in drafts I will never post.","bar.rg.nib.3.j":"I could paper the whole club with them. Very romantic wallpaper.","bar.rg.nib.3.l":"Drafts are safe. Nobody can say no to a draft.","bar.rg.nib.3.r":"Moth Mojito. Cold enough to stop me thinking.","bar.rg.nib.4":"The two of them did not work out. Their words, not mine. And now I am holding all my drafts again.","bar.rg.nib.4.j":"Maybe I will write a letter to myself and ask what to do.","bar.rg.nib.4.l":"Is it terrible that I felt relieved? Then guilty. Then relieved again.","bar.rg.nib.4.r":"A Dew Drop. Clean, like a new sheet of paper.","bar.rg.nib.5":"I picked one draft. The shortest one. It just says I miss the way you laugh.","bar.rg.nib.5.j":"Seven words. I spent longer on the envelope.","bar.rg.nib.5.l":"Short is braver. There is no room to hide.","bar.rg.nib.5.r":"Beetle Juice. Like the summer we met.","bar.rg.nib.6":"They wrote back, in their own paw, full of spelling mistakes. It is the best letter I have ever read. Take my old pen nib. It wrote enough for others.","bar.rg.nib.6.j":"I corrected none of the mistakes. That is love.","bar.rg.nib.6.l":"We are meeting here at the bar. If you see us, look away politely.","bar.rg.nib.6.r":"Firefly Fizz, for good news. You always pour it right.","bar.rg.nib.done":"Nib wraps a worn pen nib in a scrap of paper and leaves it by your glass.","bar.rg.nib.hi.j":"Your joke ended up in a letter. Uncredited. Sorry.","bar.rg.nib.hi.l":"I wrote down what you said last time. In the margin.","bar.rg.nod":"{name} gives you a slow nod.","bar.rg.none":"Nobody has told you their story yet.","bar.rg.page":"Regulars","bar.rg.part":"{n} of {of}","bar.rg.pebble.0":"I came in on the data tide from the outer islands. Everything here is so fast and so loud.","bar.rg.pebble.0.j":"On the islands loud means a gull. Here it means everything.","bar.rg.pebble.0.l":"Out there you hear the wind before anything else. Here I hear everything at once.","bar.rg.pebble.0.r":"Sweet and a little sour. That is island fruit.","bar.rg.pebble.1":"Got lost between two plazas today. Same lamps, same benches. In the end I drew a map on my paw.","bar.rg.pebble.1.j":"My paw map has a sea monster in the corner. For tradition.","bar.rg.pebble.1.l":"It is still on my paw. Look. The left plaza has the bent lamp.","bar.rg.pebble.1.r":"Warm and slow. Just right after all that walking.","bar.rg.pebble.2":"I called home. The line kept breaking up. I heard my sister laugh, and then only static.","bar.rg.pebble.2.j":"Maybe the static was laughing too. It sounded happy.","bar.rg.pebble.2.l":"Just the laugh was enough. I will call again on a quiet night.","bar.rg.pebble.2.r":"The island fruit again. You remembered.","bar.rg.pebble.3":"I found a fountain that sounds like the shore if you shut your eyes. I sat there for an hour.","bar.rg.pebble.3.j":"A cat asked if I was asleep. I said no, I was at the beach.","bar.rg.pebble.3.l":"Next time I will bring someone. Maybe.","bar.rg.pebble.3.r":"Cold and fresh, like a wave on the paws.","bar.rg.pebble.4":"Someone at work said my accent sounds like dial tone. I have been very quiet since.","bar.rg.pebble.4.j":"Dial tone is a classic sound. I am basically retro.","bar.rg.pebble.4.l":"My accent is from the islands. I think I will keep it.","bar.rg.pebble.4.r":"Cold and green. It wakes me back up.","bar.rg.pebble.5":"A cat from home moved in two streets over! We cooked island food together and burned all of it.","bar.rg.pebble.5.j":"The smoke alarm sang us a song from home.","bar.rg.pebble.5.l":"It tasted like home anyway. Burnt home.","bar.rg.pebble.5.r":"Fizz! The island has nothing this bubbly.","bar.rg.pebble.6":"I brought a stone from the shore when I came. It has the wave mark on it. I think it should stay here now, with you. This is where I come back to.","bar.rg.pebble.6.j":"Look after it. It has seen worse tides than a Saturday here.","bar.rg.pebble.6.l":"I will still miss the sea. But I will miss this too, when I go home to visit.","bar.rg.pebble.6.r":"Warm and sweet. That is what this place is now.","bar.rg.pebble.done":"Pebble puts a smooth stone with a wave mark in your paw.","bar.rg.pebble.hi.j":"I told my sister your joke from last time. The line held for that.","bar.rg.pebble.hi.l":"You listened last time. I slept better for it.","bar.rg.pip.0":"I am a courier. I run packets across the Wired on foot when the lines are too slow, which is always.","bar.rg.pip.0.j":"I am faster than the network. Do not tell the network.","bar.rg.pip.0.l":"Fast is all I know. If I stop, the next one is already late.","bar.rg.pip.0.r":"Moth Mojito. Cold. I ran here.","bar.rg.pip.1":"I crossed the whole Wired tonight. The harbour to the arcade and back before the lights changed.","bar.rg.pip.1.j":"I would race you, but you are working.","bar.rg.pip.1.l":"Nobody saw. That is the thing about couriers. Nobody sees.","bar.rg.pip.1.r":"Firefly Fizz! A fizzy finish line.","bar.rg.pip.2":"I twisted my paw on the bridge steps. The packet got there. I did not, for a while.","bar.rg.pip.2.j":"The packet had a get well note in it, for someone else. I read it anyway.","bar.rg.pip.2.l":"I sat on the steps and watched the others run past. Everyone is in a hurry.","bar.rg.pip.2.r":"Night Nectar. Warm, for a sore paw.","bar.rg.pip.3":"I am off my feet for the heat wave. The dispatch board gave my routes away in a day.","bar.rg.pip.3.j":"They replaced me with two couriers and a bicycle.","bar.rg.pip.3.l":"It hurt how fast they did it. Like I was never there.","bar.rg.pip.3.r":"A Dew Drop. Cold. This heat is too much.","bar.rg.pip.4":"I walked my old route slowly today. There is a fountain by the arcade I never noticed. I ran past it every night.","bar.rg.pip.4.j":"I sat by it so long a pigeon tried to deliver me.","bar.rg.pip.4.l":"Who knew the Wired had fountains?","bar.rg.pip.4.r":"Beetle Juice. Sweet and slow.","bar.rg.pip.5":"Dispatch offered my routes back, faster than ever. I said no. I think.","bar.rg.pip.5.j":"The first delivery I ever turned down. I feel like a rebel.","bar.rg.pip.5.l":"I miss running. I do not miss never stopping.","bar.rg.pip.5.r":"Bramble Cider. Exactly my mood, fizzy and unsure.","bar.rg.pip.6":"I teach the new couriers now. The routes, and the fountain. My old tag is yours. You were the only stop I ever sat down at.","bar.rg.pip.6.j":"The bicycle got fired. I had nothing to do with it.","bar.rg.pip.6.l":"I will still run sometimes. Just for fun now.","bar.rg.pip.6.r":"Firefly Fizz. A finish line I get to stand at.","bar.rg.pip.done":"Pip unclips a scuffed courier tag from their bag and leaves it on the bar.","bar.rg.pip.hi.j":"Your joke made me trip on the stairs. Worth it.","bar.rg.pip.hi.l":"I thought about your words the whole slow walk here.","bar.rg.sorrel.0":"The night bus ends its last loop at your door. Every face on board is going home to someone.","bar.rg.sorrel.0.j":"I would offer you a ride, but you would have to tap your card.","bar.rg.sorrel.0.l":"Nobody talks to the driver. They talk at the window.","bar.rg.sorrel.0.r":"Night Nectar. Warm as the heater by the driver's seat.","bar.rg.sorrel.1":"A cat fell asleep on the back seat tonight. I drove the whole loop again so I would not have to wake them.","bar.rg.sorrel.1.j":"Two loops, one fare. Do not tell the depot.","bar.rg.sorrel.1.l":"They woke at their own stop and said thanks like I had planned it.","bar.rg.sorrel.1.r":"A Dew Drop. Cold and clear, like the road before dawn.","bar.rg.sorrel.2":"My sister got on at the harbour stop. We have not spoken in years. She sat right behind me and said nothing.","bar.rg.sorrel.2.j":"She paid the fare in exact change. She always did like to win.","bar.rg.sorrel.2.l":"I watched her in the mirror the whole way. She looked tired. So did I.","bar.rg.sorrel.2.r":"Beetle Juice. She used to steal mine when we were small.","bar.rg.sorrel.3":"She got off before I could say anything. I left her stop lit all night, just in case.","bar.rg.sorrel.3.j":"The depot asked why the harbour light burned so long. I blamed a moth.","bar.rg.sorrel.3.l":"I keep the mirror tilted to that seat now. Silly, I know.","bar.rg.sorrel.3.r":"Bramble Cider. Sharp enough to say what I did not.","bar.rg.sorrel.4":"I tucked a note for her in the timetable at her stop. Now I cannot sit still on my break.","bar.rg.sorrel.4.j":"If she does not answer, I will reroute the whole Wired past her window.","bar.rg.sorrel.4.l":"What if she reads it? Worse, what if she does not?","bar.rg.sorrel.4.r":"Moth Mojito. Something to do with my paws.","bar.rg.sorrel.5":"She was at the stop tonight. Not to ride. Just waiting there, with two cups of tea.","bar.rg.sorrel.5.j":"Late on the last loop for the first time ever. Worth it.","bar.rg.sorrel.5.l":"We drank the tea on the kerb while the bus idled. The timetable can wait.","bar.rg.sorrel.5.r":"Firefly Fizz! Bubbles, for once. I earned the bubbles.","bar.rg.sorrel.6":"Midwinter is the longest night on the route, and she is riding the whole loop with me. Keep my old ticket. You were the stop I always made.","bar.rg.sorrel.6.j":"If you ever need a lift home, the night bus stops right outside. I will see to it.","bar.rg.sorrel.6.l":"The bus feels less empty with someone in the front seat.","bar.rg.sorrel.6.r":"Hive Mead. Warm for the long night ahead.","bar.rg.sorrel.done":"Sorrel presses a worn night bus ticket into your paw, punched for the last loop.","bar.rg.sorrel.hi.j":"I told the night bus your joke. The brakes squealed. I think that is a laugh.","bar.rg.sorrel.hi.l":"You listened last time. I thought about it the whole loop.","bar.rg.spit":"{name} sprays it across the bar.","bar.rg.stranger":"A face at the bar","bar.rg.tansy.0":"I play the little stage on Thursdays. Three people came tonight, and one of them was the cleaner.","bar.rg.tansy.0.j":"The cleaner asked for an encore. Of the mop song. There is no mop song.","bar.rg.tansy.0.l":"The cleaner clapped, though. Really clapped.","bar.rg.tansy.0.r":"Cold and minty. My paws needed that.","bar.rg.tansy.1":"My drummer left for a band with a better name. Our name was fine. It was Static Pets.","bar.rg.tansy.1.j":"Static Pets was a great name and I will not be taking questions.","bar.rg.tansy.1.l":"We were good together. That is why it hurts.","bar.rg.tansy.1.r":"Bramble Cider. Sour enough to match.","bar.rg.tansy.2":"I wrote a song about the drummer. It is mostly cymbals. Very petty. Very good.","bar.rg.tansy.2.j":"I might play it at his next show. From the back. Loudly.","bar.rg.tansy.2.l":"You are right, it is not really about him. It is about being left.","bar.rg.tansy.2.r":"Cold and clear. Like the high notes should be.","bar.rg.tansy.3":"Practised in the stairwell until the lights timed out. The echo there is free, at least.","bar.rg.tansy.3.j":"The stairwell has better sound than the little stage. Do not tell the owner.","bar.rg.tansy.3.l":"Nobody sees the hours. You are the first one who asked.","bar.rg.tansy.3.r":"Warm and sweet. My voice says thank you.","bar.rg.tansy.4":"They gave me the big stage. Saturday. The late slot, but the big stage!","bar.rg.tansy.4.j":"I am going to need a bigger name now. Static Pets is still available.","bar.rg.tansy.4.l":"I keep saying it out loud to make sure it is real.","bar.rg.tansy.4.r":"Bubbles! Yes. Exactly what tonight tastes like.","bar.rg.tansy.5":"Saturday is tomorrow. My paws will not stop. Give them a glass to hold.","bar.rg.tansy.5.j":"If I forget the words I will just play the mop song.","bar.rg.tansy.5.l":"Breathe in, breathe out. Fine. I can do that.","bar.rg.tansy.5.r":"Something cold to hold on to. Perfect.","bar.rg.tansy.6":"The whole room sang the chorus back at me. I never even taught them the words. Here, take the setlist. You were my first real crowd.","bar.rg.tansy.6.j":"The mop song is on there now. Last line, in pencil.","bar.rg.tansy.6.l":"You heard all of it, every little Thursday. Thank you.","bar.rg.tansy.6.r":"Bramble Cider. The drink from the bad night, on the best one.","bar.rg.tansy.done":"Tansy hands you a creased setlist, signed in the corner.","bar.rg.tansy.hi.j":"Your joke from last time is in a song now. You get no royalties.","bar.rg.tansy.hi.l":"You listened last time. I wrote a verse about it.","bar.rg.told":"Told","bar.rg.wait":"{name} keeps the rest for another night.","bar.rg.wick.0":"I keep the street lamps from the harbour to the club. In January they go out faster than I can light them.","bar.rg.wick.0.j":"People think I chase moths. It is the other way round.","bar.rg.wick.0.l":"Each lamp has its own temper. I know them all by the flicker.","bar.rg.wick.0.r":"A Dew Drop. Cold, like the glass at dawn.","bar.rg.wick.1":"I climbed every ladder on the street tonight. My paws still smell of lamp oil.","bar.rg.wick.1.j":"If I fall asleep here, please do not blow me out.","bar.rg.wick.1.l":"The ladders get taller every winter. Or I get shorter.","bar.rg.wick.1.r":"Night Nectar. Warmth that does not need a wick.","bar.rg.wick.2":"The old lamp by the bridge would not light tonight. I tried every trick. It was the first one I ever tended.","bar.rg.wick.2.j":"I gave it a farewell speech. The moths came.","bar.rg.wick.2.l":"Some things just burn down. I know that. It still feels like losing a friend.","bar.rg.wick.2.r":"Beetle Juice. Sour first, then sweet. Like that lamp.","bar.rg.wick.3":"A young cat follows me on my rounds now. Asks about everything. Holds the ladder wrong.","bar.rg.wick.3.j":"Today they asked if the lamps are scared of the dark. I said only the new ones.","bar.rg.wick.3.l":"I never had anyone to teach. I do not know if I am any good at it.","bar.rg.wick.3.r":"Moth Mojito. Fitting, with my own little moth following me around.","bar.rg.wick.4":"The young one lit a lamp alone tonight. It caught first try. Mine took a whole winter.","bar.rg.wick.4.j":"I told them it was beginner's luck. It was not. Do not tell them.","bar.rg.wick.4.l":"I stood back and let them. Hardest thing I ever did on a ladder.","bar.rg.wick.4.r":"Hive Mead. Like the honey wax we used when I was small.","bar.rg.wick.5":"We put a new glass in the bridge lamp together. It lit, brighter than it ever was for me.","bar.rg.wick.5.j":"The moths are throwing a party at the bridge tonight. We are not invited.","bar.rg.wick.5.l":"Maybe the old flame was just waiting for new paws.","bar.rg.wick.5.r":"Bramble Cider. Bubbles, and a little bite. Perfect.","bar.rg.wick.6":"I am handing the harbour round to the young one. I kept the old glass from the bridge lamp. You kept a light on in here for me, so it belongs to you.","bar.rg.wick.6.j":"If your lamp ever goes out, you know who to call. Well, call the young one.","bar.rg.wick.6.l":"I will still walk the street at night. Just to see them all lit.","bar.rg.wick.6.r":"Night Nectar, like the first night. You keep a good flame.","bar.rg.wick.done":"Wick sets a small, smoky lamp glass on the bar, still a little warm.","bar.rg.wick.hi.j":"Your joke kept me laughing two lamps down the street.","bar.rg.wick.hi.l":"I thought about what you said, up on the ladder.","bar.rg.wren.0":"I run a radio show from the attic over the noodle stand, midnight till dawn. I think three cats listen.","bar.rg.wren.0.j":"My biggest fan is my mother. My second biggest is also my mother, on another radio.","bar.rg.wren.0.l":"I talk to the dark and hope something talks back.","bar.rg.wren.0.r":"Night Nectar. My voice needs it after a whole night.","bar.rg.wren.1":"Someone called in last night. They never said a word. They just listened to the music.","bar.rg.wren.1.j":"Either a fan or a very bored ghost.","bar.rg.wren.1.l":"I played them a song. They stayed on until it ended. Then click.","bar.rg.wren.1.r":"Moth Mojito. Cold and fresh, like the attic before dawn.","bar.rg.wren.2":"The quiet caller did not call tonight. I kept the line open anyway.","bar.rg.wren.2.j":"I talked to the dial tone for an hour. It is a good listener.","bar.rg.wren.2.l":"Funny how one quiet listener can fill a room.","bar.rg.wren.2.r":"A Dew Drop. A clear head for a quiet show.","bar.rg.wren.3":"The noodle stand is closing. No attic, no show.","bar.rg.wren.3.j":"I will just broadcast from my bathtub. Great echo.","bar.rg.wren.3.l":"I said goodbye on air. I hope someone heard.","bar.rg.wren.3.r":"Bramble Cider. A bitter edge and a sweet end. I hope.","bar.rg.wren.4":"The caller finally spoke. Said my show got them through a long winter, and they want to keep it going.","bar.rg.wren.4.j":"They have a garage and a very old microphone. Romance.","bar.rg.wren.4.l":"I never thought anyone needed it. I thought only I did.","bar.rg.wren.4.r":"Beetle Juice. Sweet as that voice.","bar.rg.wren.5":"The first show from the garage was tonight. The caller ran the board, and twelve cats called in.","bar.rg.wren.5.j":"Twelve! That is nine more than my mother.","bar.rg.wren.5.l":"Twelve voices in the dark. I counted every one.","bar.rg.wren.5.r":"Firefly Fizz! On the air and off it.","bar.rg.wren.6":"The summer shows start tonight. I made a tape of the first one from the garage, every bad joke on it. It is yours. You were always on my frequency.","bar.rg.wren.6.j":"Rewind it gently. It is very old, like me.","bar.rg.wren.6.l":"Tune in some time. I will play something for the bar.","bar.rg.wren.6.r":"A Dew Drop, like the first night I came in. You remember.","bar.rg.wren.done":"Wren pops a tape out of their jacket and sets it by your glass.","bar.rg.wren.hi.j":"I told your joke on air. It got a call. A complaint, but a call.","bar.rg.wren.hi.l":"You listened last time. Rare, for a radio host.","bar.sig.base":"Base","bar.sig.finish":"Finish","bar.sig.full":"Your signatures are all on the menu. Retire one to name another.","bar.sig.go":"Name it, \u2605{n}","bar.sig.hint":"Only you pour it. The spirit and the syrup come from your bag each time.","bar.sig.mine":"{base}, {tw}. {travel}.","bar.sig.name":"Its name","bar.sig.named":"{name} is yours. It is on the specials board while you are on shift.","bar.sig.new":"A new signature","bar.sig.none":"Hold a back-ba
